<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartões de Usuários</title>
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <header>
        <h1>Utilizador</h1>
        <p>Total de utilizadores: <span id="userCount">0</span></p>
        <div class="stats-container">
            <p>Ativos: <span id="activeCount" class="status-active">0</span></p>
            <p>Inativos: <span id="inactiveCount" class="status-inactive">0</span></p>
        </div>
        <div class="stats-summary">
            <p>Taxa de Atividade: <span id="activityRate">0%</span></p>
            <div class="percent">
                <div id="activityBar"></div>
            </div>
        </div>       
    </header>
    <main>
        <form id="formAdd">
            <label>Nome</label>
            <input id="name" type="text" class="boxEnter" placeholder="Digite seu nome">
            <label>E-mail</label>
            <input id="email" type="text" class="boxEnter" placeholder="Digite seu e-mail">
            <button id="add" class="">Adicionar</button>
            <span id="erro"></span>
        </form>
        <section id="userDetails" class="details-container">
            <h2>Detalhes do Utilizador</h2>
            <div id="detailsContent"></div>
            <button id="closeDetails" style="margin-top: 10px;">Fechar Detalhes</button>
        </section>
        <section id="base" class="focus">
            <div class="search-container">
                <label for="searchInput">Procurar Usuário por Nome</label>
                <input type="text" id="searchInput" placeholder="Digite para pesquisar..." class="boxEnter">
            </div>
            <div class="filters">
                <button id="sortName">Ordenar por nome (A-Z)</button>
                <button id="filterActive">Mostrar apenas ativos</button>
                <button id="showAll">Mostrar todos</button>
            </div>

            <section id="users">
                <ul id="usersList" class="user-container"></ul>
            </section>
        </section>

    </main>
    <footer>
        <p>© 2025 | Projeto realizado por Daniel Moraes - Curso Frontend, Programa UPskill, Faculdade de Ciências da Universidade de Lisboa</p>
    </footer>    
</body>
</html>
